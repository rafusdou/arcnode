<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Server icon for free-plan servers (64x64 is the only size Minecraft
       accepts). Rendered to public/free-server-icon.png with:
       rsvg-convert -w 64 -h 64 brand/free-server-icon.svg -o public/free-server-icon.png -->
  <rect width="64" height="64" rx="6" fill="#111110"/>
  <g transform="translate(13 1) scale(1.19)">
    <path d="M16 3 L28 9.5 L16 16 L4 9.5 Z" fill="#FFD266"/>
    <path d="M4 9.5 L16 16 L16 29 L4 22.5 Z" fill="#F2B33D"/>
    <path d="M16 16 L28 9.5 L28 22.5 L16 29 Z" fill="#C98C14"/>
    <path d="M16 6.4 V12.6 M12.2 9.5 H19.8" stroke="#5A3D00" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <rect x="0" y="45" width="64" height="19" fill="#F2B33D"/>
  <text x="32" y="60" text-anchor="middle" font-family="DejaVu Sans" font-weight="bold" font-size="15" letter-spacing="1" fill="#1E1503">FREE</text>
</svg>
